<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEAT·TRACK — 席占有記録ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0e13;
  --surface: #131a22;
  --surface-2: #1c252f;
  --border: #2a3441;
  --border-strong: #3d4a5c;
  --text: #e6edf3;
  --text-dim: #8a96a3;
  --text-muted: #5a6573;
  --accent: #f0a020;
  --accent-bright: #ffb830;
  --danger: #e34555;
  --success: #4caf6a;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  overflow: hidden;
}

button { font-family: inherit; }

.app {
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(440px, 3fr);
  height: 100vh;
}

/* ===== LEFT PANEL ===== */
.left {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  min-width: 0;
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--surface), var(--bg));
}

.brand {
  font-family: 'Fraunces', serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.02em;
  color: var(--accent);
  white-space: nowrap;
}
.brand span { color: var(--text); font-weight: 500; font-style: italic; }

.title-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 5px;
  font-family: inherit;
  font-size: 13px;
}
.title-input::placeholder { color: var(--text-muted); }
.title-input:focus { outline: none; border-color: var(--accent); }

.file-btn {
  background: var(--accent);
  color: #1a1a1a;
  font-weight: 700;
  border: none;
  padding: 6px 14px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  display: inline-block;
}
.file-btn:hover { background: var(--accent-bright); }
input[type="file"] { display: none; }

.video-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px 14px 12px;
  gap: 8px;
  min-height: 0;
}

.video-wrap {
  flex: 1;
  background: #000;
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.no-video {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 17px;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01) 10px, transparent 10px, transparent 20px);
  pointer-events: none;
}

.controls {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.seekbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn-play {
  width: 38px;
  height: 30px;
  background: var(--accent);
  color: #1a1a1a;
  border: none;
  border-radius: 5px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
  flex-shrink: 0;
}
.btn-play:hover { background: var(--accent-bright); }

.seekbar {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  cursor: pointer;
  outline: none;
}
.seekbar::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px var(--accent);
}
.seekbar::-moz-range-thumb {
  width: 18px; height: 18px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid var(--bg);
}

.time-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
  min-width: 130px;
  text-align: center;
  white-space: nowrap;
}
.time-display .now { color: var(--accent); font-weight: 600; }

.button-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 4px 9px;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  transition: all 0.1s;
}
.btn:hover { background: var(--border); border-color: var(--border-strong); }
.btn.active {
  background: var(--accent);
  color: #1a1a1a;
  border-color: var(--accent);
  font-weight: 700;
}

.divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

.label-tiny {
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
}

/* ===== RIGHT PANEL ===== */
.right {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

.right-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
.right-header h2 {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.01em;
}
.right-header .desc {
  color: var(--text-muted);
  font-size: 11px;
  margin-top: 2px;
  line-height: 1.5;
}

.groups-section {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 170px;
  flex-shrink: 0;
}
.groups-section .label-tiny { margin-bottom: 2px; }

.groups-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 0;
}

.group-empty {
  color: var(--text-muted);
  font-size: 11px;
  padding: 10px;
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: 5px;
}

.group-item {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 5px 8px;
  border-radius: 4px;
  cursor: pointer;
  background: var(--bg);
  border: 1px solid transparent;
  font-size: 12px;
}
.group-item:hover { background: var(--surface-2); }
.group-item.active {
  border-color: var(--accent);
  background: rgba(240, 160, 32, 0.08);
}

.group-color {
  width: 12px; height: 12px;
  border-radius: 3px;
  flex-shrink: 0;
}

.group-label {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
}

.group-count {
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
  font-size: 11px;
  background: var(--surface-2);
  padding: 1px 6px;
  border-radius: 3px;
}

.group-leave-all {
  font-size: 10px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 2px 7px;
  border-radius: 3px;
  cursor: pointer;
  font-family: inherit;
}
.group-leave-all:hover {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}

.add-group-btn {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-dim);
  padding: 5px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
.add-group-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* Seat grid */
.seats-section {
  flex: 1;
  overflow-y: auto;
  padding: 10px 14px;
  min-height: 0;
}
.seats-section .label-tiny { margin-bottom: 8px; display: block; }

.tables-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.block-row {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.table {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 5px 5px 6px;
}

.table-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 3px;
  text-align: center;
}

.seats {
  display: grid;
  grid-template-columns: repeat(var(--seat-cols, 6), 1fr);
  grid-template-rows: 1fr 1fr;
  gap: 3px;
}

.seat {
  aspect-ratio: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.1s;
  position: relative;
}
.seat:hover {
  transform: scale(1.12);
  z-index: 2;
  box-shadow: 0 0 0 1px var(--accent);
}
.seat.occupied {
  border-color: rgba(255,255,255,0.25);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
}

.bottom-bar {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  background: var(--surface-2);
  flex-shrink: 0;
}

.btn-undo {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 7px 12px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}
.btn-undo:hover { background: var(--surface); color: var(--text); }

.btn-init-check {
  background: transparent;
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 7px 12px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}
.btn-init-check:hover { background: rgba(240, 160, 32, 0.12); }
.btn-init-check.done {
  border-color: var(--success);
  color: var(--success);
}

.btn-submit {
  flex: 1;
  background: var(--accent);
  color: #1a1a1a;
  border: none;
  padding: 8px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.02em;
  font-family: 'Fraunces', serif;
}
.btn-submit:hover { background: var(--accent-bright); }
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 26px;
  width: 560px;
  max-width: 92vw;
  max-height: 90vh;
  overflow-y: auto;
}

.modal h3 {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 20px;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}

.modal .summary {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 18px;
  font-family: 'JetBrains Mono', monospace;
}

.modal-section { margin-bottom: 18px; }

.modal-section label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
}

.modal input[type="text"], .modal input[type="password"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 12px;
  border-radius: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  margin-bottom: 6px;
}
.modal input:focus { outline: none; border-color: var(--accent); }

.modal-action-btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  font-family: inherit;
}

.btn-confirm {
  background: var(--accent);
  color: #1a1a1a;
}
.btn-confirm:hover { background: var(--accent-bright); }

.btn-confirm-alt {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border-strong);
}
.btn-confirm-alt:hover { background: var(--border); }

.btn-cancel {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 9px 16px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  width: 100%;
}
.btn-cancel:hover { background: var(--border); }

.section-divider {
  height: 1px;
  background: var(--border);
  margin: 16px 0 18px;
  position: relative;
}
.section-divider::after {
  content: 'OR';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: var(--surface);
  padding: 0 10px;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}

.events-log {
  max-height: 180px;
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 10px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  line-height: 1.7;
}
.events-log .ev { color: var(--text-dim); }
.events-log .ev .t { color: var(--accent); }
.events-log .ev .enter { color: var(--success); font-weight: 600; }
.events-log .ev .leave { color: var(--danger); font-weight: 600; }

.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error { border-color: var(--danger); color: var(--danger); }

.help-hint {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  line-height: 1.5;
  font-family: 'JetBrains Mono', monospace;
}
</style>
</head>
<body>
<div class="app">
  <!-- LEFT -->
  <div class="left">
    <div class="header">
      <div class="brand">SEAT<span>·track</span></div>
      <input type="text" class="title-input" id="titleInput" placeholder="動画の題名を入力...">
      <label class="file-btn">
        動画を選択
        <input type="file" id="fileInput" accept="video/*">
      </label>
    </div>

    <div class="video-area">
      <div class="video-wrap">
        <video id="video" preload="metadata" controls></video>
        <div class="no-video" id="noVideo">動画ファイルを選択してください</div>
      </div>

      <div class="controls">
        <div class="seekbar-row">
          <button class="btn-play" id="playBtn" title="再生/一時停止 (Space)">▶</button>
          <input type="range" class="seekbar" id="seekbar" min="0" max="100" value="0" step="0.01">
          <div class="time-display"><span class="now" id="curTime">0:00.00</span> / <span id="totalTime">0:00.00</span></div>
        </div>
        <div class="button-row">
          <span class="label-tiny">SKIP</span>
          <button class="btn" data-skip="-10">-10s</button>
          <button class="btn" data-skip="-1">-1s</button>
          <button class="btn" data-skip="-0.1">-0.1s</button>
          <button class="btn" data-skip="0.1">+0.1s</button>
          <button class="btn" data-skip="1">+1s</button>
          <button class="btn" data-skip="10">+10s</button>
          <div class="divider"></div>
          <span class="label-tiny">SPEED</span>
          <button class="btn speed-btn" data-speed="0.25">0.25x</button>
          <button class="btn speed-btn" data-speed="0.5">0.5x</button>
          <button class="btn speed-btn active" data-speed="1">1x</button>
          <button class="btn speed-btn" data-speed="1.5">1.5x</button>
          <button class="btn speed-btn" data-speed="2">2x</button>
          <button class="btn speed-btn" data-speed="3">3x</button>
          <button class="btn speed-btn" data-speed="4">4x</button>
          <div class="divider"></div>
          <button class="btn active" id="nativeCtrlBtn" title="ブラウザ標準のコントロールを切替">native</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="right-header">
      <h2>記録パネル</h2>
      <div class="desc">グループ選択 → 席クリックで <span style="color:var(--success)">入店</span> / もう一度で <span style="color:var(--danger)">退店</span> 記録</div>
    </div>

    <div class="groups-section">
      <span class="label-tiny">グループ (属性)</span>
      <div class="groups-list" id="groupsList"></div>
      <button class="add-group-btn" id="addGroupBtn">+ 新しいグループを作成</button>
    </div>

    <div class="seats-section">
      <span class="label-tiny">席配置 — ((2×3)×4 + (2×2)) × 8段 = 224席</span>
      <div class="tables-grid" id="tablesGrid"></div>
    </div>

    <div class="bottom-bar">
      <button class="btn-undo" id="undoBtn" title="直前の操作を取消 (Ctrl+Z)">↶ 取消</button>
      <button class="btn-init-check" id="initCheckDoneBtn" title="開始時点の着席者チェックを終了">初期配置チェック完了</button>
      <button class="btn-submit" id="submitBtn">提出する</button>
    </div>
  </div>
</div>

<!-- Submit modal -->
<div class="modal-overlay" id="submitModal">
  <div class="modal">
    <h3>記録を提出</h3>
    <div class="summary" id="submitSummary"></div>

    <div class="modal-section">
      <label>記録内容のプレビュー (直近50件)</label>
      <div class="events-log" id="eventsLog"></div>
    </div>

    <div class="modal-section">
      <label>方法 1 — ローカルにJSONとしてダウンロード</label>
      <button class="modal-action-btn btn-confirm" id="downloadBtn">JSONをダウンロード</button>
    </div>

    <button class="btn-cancel" id="closeModalBtn">閉じる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============== STATE ==============
const COLORS = [
  '#f0a020', '#4caf6a', '#3da9fc', '#e35d8a', '#9b6dd0',
  '#d97757', '#5fb3a1', '#c4b035', '#7a5cd9', '#dc6d6d',
  '#3da080', '#b562a8', '#ce8a3a', '#5dadce', '#7c9c4a',
  '#d04c8a', '#5d7cce', '#c9a035', '#6dc09a', '#a06dcd'
];

const state = {
  videoFile: null,
  groups: [],            // { id, label, color, createdAt }
  activeGroupId: null,
  events: [],            // { videoTime, action: 'enter'|'leave', seatId, groupId }
  seatStates: {},        // seatId -> { groupId, enterTime } | null
  history: [],           // for undo: array of { events:[], seats:{seatId: previousState} }
  initialCheckMode: false,
  initialCheckDone: false
};

// ============== DOM ==============
const $ = (id) => document.getElementById(id);
const video = $('video');
const noVideo = $('noVideo');
const seekbar = $('seekbar');
const curTime = $('curTime');
const totalTime = $('totalTime');
const playBtn = $('playBtn');
const titleInput = $('titleInput');
const fileInput = $('fileInput');
const groupsList = $('groupsList');
const tablesGrid = $('tablesGrid');
const submitBtn = $('submitBtn');
const undoBtn = $('undoBtn');
const initCheckDoneBtn = $('initCheckDoneBtn');
const submitModal = $('submitModal');
const toast = $('toast');

// ============== Helpers ==============
function fmtTime(t) {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  const cs = Math.floor((t % 1) * 100);
  if (m >= 60) {
    const h = Math.floor(m / 60);
    return `${h}:${String(m % 60).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  }
  return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

function timeBucket(t) {
  return Math.round(t * 100) / 100;
}

function showToast(msg, type='info') {
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
}

function isInitialCheckPending() {
  return !!state.videoFile && !state.initialCheckDone;
}

function ensureInitialCheckDone() {
  if (!isInitialCheckPending()) return true;
  showToast('まず開始時点の着席者をチェックし「初期配置チェック完了」を押してください', 'error');
  return false;
}

function updateInitialCheckButton() {
  initCheckDoneBtn.disabled = !state.videoFile || state.initialCheckDone;
  initCheckDoneBtn.classList.toggle('done', state.initialCheckDone);
}

function startInitialCheckMode() {
  state.initialCheckMode = true;
  state.initialCheckDone = false;
  video.pause();
  video.currentTime = 0;
  seekbar.value = 0;
  curTime.textContent = fmtTime(0);
  updateInitialCheckButton();
  showToast('初期配置チェック: 開始時点で着席している席をクリックしてください（1席=1グループ）');
}

function getLastSeatEvent(seatId) {
  for (let i = state.events.length - 1; i >= 0; i--) {
    const ev = state.events[i];
    if (ev.seatId === seatId) return ev;
  }
  return null;
}

// ============== Build seat grid ==============
function buildSeatGrid() {
  const html = [];
  let tableNum = 1;
  for (let row = 0; row < 8; row++) {
    let rowHtml = '';
    for (let block = 0; block < 5; block++) {
      const seatCols = block < 4 ? 3 : 2; // (2*3)*4 + (2*2)
      const tableId = `T${String(tableNum).padStart(2,'0')}`;
      let seats = '';
      for (let sy = 0; sy < 2; sy++) {
        for (let sx = 0; sx < seatCols; sx++) {
          const seatNum = sy * seatCols + sx + 1;
          const seatId = `${tableId}-S${String(seatNum).padStart(2,'0')}`;
          seats += `<div class="seat" data-seat="${seatId}" title="${seatId}"></div>`;
        }
      }
      rowHtml += `<div class="table"><div class="table-num">${tableId}</div><div class="seats" style="--seat-cols:${seatCols}">${seats}</div></div>`;
      tableNum++;
    }
    html.push(`<div class="block-row">${rowHtml}</div>`);
  }
  tablesGrid.innerHTML = html.join('');

  tablesGrid.addEventListener('click', (e) => {
    const seat = e.target.closest('.seat');
    if (seat) handleSeatClick(seat.dataset.seat);
  });
}

// ============== Groups ==============
function renderGroups() {
  if (state.groups.length === 0) {
    groupsList.innerHTML = '<div class="group-empty">グループ未登録 — 下のボタンで作成</div>';
    return;
  }
  groupsList.innerHTML = state.groups.map(g => {
    const occCount = Object.values(state.seatStates).filter(s => s && s.groupId === g.id).length;
    return `
      <div class="group-item ${g.id === state.activeGroupId ? 'active' : ''}" data-group="${g.id}">
        <div class="group-color" style="background:${g.color}"></div>
        <div class="group-label">${g.label}</div>
        <div class="group-count">${occCount}席</div>
        ${occCount > 0 ? `<button class="group-leave-all" data-leave="${g.id}" title="このグループ全員を退店記録">全員退店</button>` : ''}
      </div>
    `;
  }).join('');
}

function addGroup() {
  const id = 'g' + (state.groups.length + 1);
  const color = COLORS[state.groups.length % COLORS.length];
  const label = `グループ ${state.groups.length + 1}`;
  state.groups.push({ id, label, color, createdAt: Date.now() });
  state.activeGroupId = id;
  renderGroups();
}

function createGroupAuto() {
  const id = 'g' + (state.groups.length + 1);
  const color = COLORS[state.groups.length % COLORS.length];
  const label = `グループ ${state.groups.length + 1}`;
  state.groups.push({ id, label, color, createdAt: Date.now() });
  return id;
}

groupsList.addEventListener('click', (e) => {
  const leaveBtn = e.target.closest('[data-leave]');
  if (leaveBtn) {
    e.stopPropagation();
    leaveAllInGroup(leaveBtn.dataset.leave);
    return;
  }
  const item = e.target.closest('[data-group]');
  if (item) {
    state.activeGroupId = item.dataset.group;
    renderGroups();
  }
});

function leaveAllInGroup(groupId) {
  if (state.initialCheckMode) {
    showToast('初期配置チェック中は退店操作できません', 'error');
    return;
  }
  const time = video.currentTime || 0;
  const seatsToLeave = Object.entries(state.seatStates)
    .filter(([_, s]) => s && s.groupId === groupId)
    .map(([sid]) => sid);
  if (seatsToLeave.length === 0) return;

  const undoStep = { events: [], seats: {} };
  for (const sid of seatsToLeave) {
    undoStep.seats[sid] = state.seatStates[sid] ? { ...state.seatStates[sid] } : null;
    const ev = { videoTime: time, action: 'leave', seatId: sid, groupId };
    state.events.push(ev);
    undoStep.events.push(ev);
    state.seatStates[sid] = null;
  }
  state.history.push(undoStep);
  refreshSeatVisuals();
  renderGroups();
  showToast(`${seatsToLeave.length}席を退店記録 (${fmtTime(time)})`, 'success');
}

$('addGroupBtn').addEventListener('click', addGroup);

// ============== Seat click ==============
function handleSeatClick(seatId) {
  if (!state.videoFile) {
    showToast('まず動画ファイルを選択してください', 'error');
    return;
  }
  if (state.initialCheckMode) {
    if (state.seatStates[seatId]) {
      showToast('初期配置の解除は取消ボタンで行ってください', 'error');
      return;
    }
    const groupId = createGroupAuto();
    state.activeGroupId = groupId;
    const undoStep = { events: [], seats: { [seatId]: null } };
    const ev = { videoTime: 0, action: 'enter', seatId, groupId };
    state.events.push(ev);
    undoStep.events.push(ev);
    state.history.push(undoStep);
    state.seatStates[seatId] = { groupId, enterTime: 0 };
    refreshSeatVisuals();
    renderGroups();
    return;
  }
  const time = video.currentTime || 0;
  const cur = state.seatStates[seatId];

  if (cur) {
    // Leave
    if (time < cur.enterTime) {
      showToast(`時系列エラー: 退店時刻 (${fmtTime(time)}) が入店時刻 (${fmtTime(cur.enterTime)}) より前です`, 'error');
      return;
    }
    const undoStep = { events: [], seats: { [seatId]: { ...cur } } };
    const ev = { videoTime: time, action: 'leave', seatId, groupId: cur.groupId };
    state.events.push(ev);
    undoStep.events.push(ev);
    state.history.push(undoStep);
    state.seatStates[seatId] = null;
  } else {
    const lastEv = getLastSeatEvent(seatId);
    if (lastEv && lastEv.action === 'leave' && time < lastEv.videoTime) {
      showToast(`時系列エラー: 入店時刻 (${fmtTime(time)}) が直前の退店時刻 (${fmtTime(lastEv.videoTime)}) より前です`, 'error');
      return;
    }
    // Enter: same timestamp => same group, otherwise new group.
    const currentBucket = timeBucket(time);
    const sameTimeEnter = [...state.events].reverse().find(e =>
      e.action === 'enter' && timeBucket(e.videoTime) === currentBucket
    );
    const groupId = sameTimeEnter ? sameTimeEnter.groupId : createGroupAuto();
    state.activeGroupId = groupId;
    const undoStep = { events: [], seats: { [seatId]: null } };
    const ev = { videoTime: time, action: 'enter', seatId, groupId };
    state.events.push(ev);
    undoStep.events.push(ev);
    state.history.push(undoStep);
    state.seatStates[seatId] = { groupId, enterTime: time };
  }
  refreshSeatVisuals();
  renderGroups();
}

function refreshSeatVisuals() {
  document.querySelectorAll('.seat').forEach(el => {
    const sid = el.dataset.seat;
    const s = state.seatStates[sid];
    if (s) {
      const g = state.groups.find(x => x.id === s.groupId);
      el.classList.add('occupied');
      el.style.background = g ? g.color : 'var(--accent)';
    } else {
      el.classList.remove('occupied');
      el.style.background = '';
    }
  });
}

// ============== Undo ==============
function doUndo() {
  const last = state.history.pop();
  if (!last) {
    showToast('取り消す操作がありません', 'error');
    return;
  }
  for (const ev of last.events) {
    const i = state.events.lastIndexOf(ev);
    if (i >= 0) state.events.splice(i, 1);
  }
  for (const [sid, prev] of Object.entries(last.seats)) {
    state.seatStates[sid] = prev;
  }
  refreshSeatVisuals();
  renderGroups();
  showToast(`${last.events.length}件取消しました`);
}
undoBtn.addEventListener('click', doUndo);

// ============== Video ==============
fileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  state.videoFile = f;
  state.groups = [];
  state.activeGroupId = null;
  state.events = [];
  state.seatStates = {};
  state.history = [];
  state.initialCheckMode = false;
  state.initialCheckDone = false;
  renderGroups();
  refreshSeatVisuals();
  if (!titleInput.value.trim()) titleInput.value = f.name;
  seekbar.value = 0;
  curTime.textContent = fmtTime(0);
  totalTime.textContent = fmtTime(0);
  // reset overlay
  noVideo.innerHTML = '読み込み中...';
  noVideo.style.display = 'flex';
  console.log('[video] selected', f.name, f.type, f.size);
  const url = URL.createObjectURL(f);
  video.src = url;
  video.load();
  updateInitialCheckButton();
});

video.addEventListener('loadedmetadata', () => {
  seekbar.max = video.duration;
  seekbar.step = 0.01;
  totalTime.textContent = fmtTime(video.duration);
  noVideo.style.display = 'none';
  startInitialCheckMode();
});

video.addEventListener('error', () => {
  const err = video.error;
  const codes = {
    1: 'MEDIA_ERR_ABORTED — 読み込みが中断されました',
    2: 'MEDIA_ERR_NETWORK — ネットワークエラー',
    3: 'MEDIA_ERR_DECODE — デコードエラー (コーデック非対応の可能性)',
    4: 'MEDIA_ERR_SRC_NOT_SUPPORTED — このブラウザがこのフォーマット/コーデックをサポートしていません'
  };
  const msg = err ? (codes[err.code] || `エラー (code ${err.code})`) : '不明なエラー';
  console.error('[video error]', err);
  noVideo.innerHTML = `<div style="text-align:center; line-height:1.7; padding:20px;">
    <div style="color:var(--danger); font-style:normal; font-family:'JetBrains Mono',monospace; font-size:13px; margin-bottom:8px;">⚠ 再生不可</div>
    <div style="font-size:14px;">${msg}</div>
    <div style="font-size:11px; color:var(--text-muted); font-style:normal; font-family:'JetBrains Mono',monospace; margin-top:12px;">
      H.264 (.mp4) / WebM 形式なら大体のブラウザで再生できます<br>
      HEVC (H.265) / MOV / MKV / AVI はブラウザにより不可
    </div>
  </div>`;
  noVideo.style.display = 'flex';
});
video.addEventListener('timeupdate', () => {
  if (!seekbar.matches(':active')) seekbar.value = video.currentTime;
  curTime.textContent = fmtTime(video.currentTime);
});
video.addEventListener('play', () => playBtn.textContent = '❚❚');
video.addEventListener('pause', () => playBtn.textContent = '▶');

seekbar.addEventListener('input', () => {
  if (!state.videoFile) return;
  const t = parseFloat(seekbar.value);
  if (!Number.isFinite(t)) return;
  // During drag, update the visible time only. Actual seek is committed on change.
  curTime.textContent = fmtTime(t);
});

seekbar.addEventListener('change', () => {
  if (!state.videoFile) return;
  if (!ensureInitialCheckDone()) {
    seekbar.value = video.currentTime || 0;
    return;
  }
  if (video.readyState < 1) return; // metadata not ready
  let t = parseFloat(seekbar.value);
  if (!Number.isFinite(t)) return;
  const dur = video.duration;
  if (Number.isFinite(dur) && dur > 0) {
    t = Math.max(0, Math.min(dur, t));
  }
  if (Math.abs(video.currentTime - t) > 0.001) video.currentTime = t;
});

playBtn.addEventListener('click', () => {
  if (!state.videoFile) return;
  if (!ensureInitialCheckDone()) return;
  if (video.paused) {
    video.play().catch(err => {
      console.error('[play error]', err);
      showToast('再生エラー: ' + err.message, 'error');
    });
  } else {
    video.pause();
  }
});

document.querySelectorAll('[data-skip]').forEach(b => {
  b.addEventListener('click', () => {
    if (!state.videoFile) return;
    if (!ensureInitialCheckDone()) return;
    const dur = video.duration || 0;
    video.currentTime = Math.max(0, Math.min(dur, video.currentTime + parseFloat(b.dataset.skip)));
  });
});

document.querySelectorAll('[data-speed]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    video.playbackRate = parseFloat(b.dataset.speed);
  });
});

$('nativeCtrlBtn').addEventListener('click', () => {
  video.controls = !video.controls;
  $('nativeCtrlBtn').classList.toggle('active', video.controls);
});

// keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (!state.videoFile) return;
    if (!ensureInitialCheckDone()) return;
    if (video.paused) video.play(); else video.pause();
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    if (!ensureInitialCheckDone()) return;
    video.currentTime = Math.max(0, video.currentTime - (e.shiftKey ? 5 : 1));
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    if (!ensureInitialCheckDone()) return;
    video.currentTime = Math.min(video.duration || 0, video.currentTime + (e.shiftKey ? 5 : 1));
  } else if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
    e.preventDefault();
    doUndo();
  }
});

// ============== Submit ==============
function buildExport() {
  const open = {};
  const sessions = [];
  const sorted = [...state.events].sort((a,b) => a.videoTime - b.videoTime);
  for (const e of sorted) {
    if (e.action === 'enter') {
      open[e.seatId] = { groupId: e.groupId, enterTime: e.videoTime };
    } else {
      const o = open[e.seatId];
      sessions.push({
        seatId: e.seatId,
        groupId: o ? o.groupId : e.groupId,
        enterTime: o ? o.enterTime : null,
        leaveTime: e.videoTime
      });
      delete open[e.seatId];
    }
  }
  // ongoing sessions (not yet left)
  for (const [sid, o] of Object.entries(open)) {
    sessions.push({ seatId: sid, groupId: o.groupId, enterTime: o.enterTime, leaveTime: null });
  }
  return {
    videoTitle: titleInput.value.trim() || (state.videoFile ? state.videoFile.name : 'untitled'),
    videoFileName: state.videoFile ? state.videoFile.name : null,
    exportedAt: new Date().toISOString(),
    layout: { rows: 8, patternPerRow: ['2x3', '2x3', '2x3', '2x3', '2x2'], totalTables: 40, totalSeats: 224 },
    groups: state.groups,
    events: sorted,
    sessions
  };
}

submitBtn.addEventListener('click', () => {
  if (!ensureInitialCheckDone()) return;
  const data = buildExport();
  $('submitSummary').textContent = `events: ${data.events.length}  /  groups: ${data.groups.length}  /  sessions: ${data.sessions.length}`;
  const log = data.events.slice(-50).reverse().map(e => {
    const g = state.groups.find(x => x.id === e.groupId);
    const lbl = e.action === 'enter' ? '入店' : '退店';
    return `<div class="ev"><span class="t">${fmtTime(e.videoTime)}</span> <span class="${e.action}">${lbl}</span> ${e.seatId} <span style="color:${g?.color || '#fff'}">●</span> ${g?.label || e.groupId}</div>`;
  }).join('');
  $('eventsLog').innerHTML = log || '<div style="color:var(--text-muted)">記録イベントはまだありません</div>';

  submitModal.classList.add('show');
});

$('closeModalBtn').addEventListener('click', () => submitModal.classList.remove('show'));
submitModal.addEventListener('click', (e) => {
  if (e.target === submitModal) submitModal.classList.remove('show');
});

$('downloadBtn').addEventListener('click', () => {
  const data = buildExport();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const safe = (data.videoTitle || 'record').replace(/[^a-zA-Z0-9_\-.]/g, '_').slice(0, 60);
  a.download = `seattrack_${safe}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('ダウンロードしました', 'success');
});

initCheckDoneBtn.addEventListener('click', () => {
  if (!state.videoFile || state.initialCheckDone) return;
  state.initialCheckMode = false;
  state.initialCheckDone = true;
  updateInitialCheckButton();
  showToast('初期配置チェックを完了しました', 'success');
});

// ============== Init ==============
buildSeatGrid();
renderGroups();
updateInitialCheckButton();
</script>
</body>
</html>
