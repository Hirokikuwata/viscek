<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEAT·TRACK — 席占有記録ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0e13;
  --surface: #131a22;
  --surface-2: #1c252f;
  --border: #2a3441;
  --border-strong: #3d4a5c;
  --text: #e6edf3;
  --text-dim: #8a96a3;
  --text-muted: #5a6573;
  --accent: #f0a020;
  --accent-bright: #ffb830;
  --danger: #e34555;
  --success: #4caf6a;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  overflow: hidden;
}

button { font-family: inherit; }

.app {
  display: grid;
  grid-template-columns: minmax(0, 7fr) minmax(440px, 3fr);
  height: 100vh;
}

/* ===== LEFT PANEL ===== */
.left {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  min-width: 0;
}

.header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--surface), var(--bg));
}

.brand {
  font-family: 'Fraunces', serif;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--accent);
  white-space: nowrap;
}
.brand span { color: var(--text); font-weight: 500; font-style: italic; }

.title-input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 12px;
  border-radius: 6px;
  font-family: inherit;
  font-size: 13px;
}
.title-input::placeholder { color: var(--text-muted); }
.title-input:focus { outline: none; border-color: var(--accent); }

.file-btn {
  background: var(--accent);
  color: #1a1a1a;
  font-weight: 700;
  border: none;
  padding: 9px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  white-space: nowrap;
  display: inline-block;
}
.file-btn:hover { background: var(--accent-bright); }
input[type="file"] { display: none; }

.video-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 18px 20px;
  gap: 12px;
  min-height: 0;
}

.video-wrap {
  flex: 1;
  background: #000;
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  min-height: 0;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.no-video {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 17px;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,0.01), rgba(255,255,255,0.01) 10px, transparent 10px, transparent 20px);
  pointer-events: none;
}

.controls {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.seekbar-row {
  display: flex;
  align-items: center;
  gap: 14px;
}

.btn-play {
  width: 44px;
  height: 36px;
  background: var(--accent);
  color: #1a1a1a;
  border: none;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
  flex-shrink: 0;
}
.btn-play:hover { background: var(--accent-bright); }

.seekbar {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  cursor: pointer;
  outline: none;
}
.seekbar::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 0 0 1px var(--accent);
}
.seekbar::-moz-range-thumb {
  width: 18px; height: 18px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid var(--bg);
}

.time-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
  min-width: 130px;
  text-align: center;
  white-space: nowrap;
}
.time-display .now { color: var(--accent); font-weight: 600; }

.button-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 6px 11px;
  border-radius: 5px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  transition: all 0.1s;
}
.btn:hover { background: var(--border); border-color: var(--border-strong); }
.btn.active {
  background: var(--accent);
  color: #1a1a1a;
  border-color: var(--accent);
  font-weight: 700;
}

.divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

.label-tiny {
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
}

/* ===== RIGHT PANEL ===== */
.right {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  min-width: 0;
}

.right-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
}
.right-header h2 {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.01em;
}
.right-header .desc {
  color: var(--text-muted);
  font-size: 11px;
  margin-top: 2px;
  line-height: 1.5;
}

.groups-section {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 230px;
}
.groups-section .label-tiny { margin-bottom: 4px; }

.groups-list {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 0;
}

.group-empty {
  color: var(--text-muted);
  font-size: 11px;
  padding: 10px;
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: 5px;
}

.group-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border-radius: 5px;
  cursor: pointer;
  background: var(--bg);
  border: 1px solid transparent;
  font-size: 12px;
}
.group-item:hover { background: var(--surface-2); }
.group-item.active {
  border-color: var(--accent);
  background: rgba(240, 160, 32, 0.08);
}

.group-color {
  width: 12px; height: 12px;
  border-radius: 3px;
  flex-shrink: 0;
}

.group-label {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
}

.group-count {
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
  font-size: 11px;
  background: var(--surface-2);
  padding: 1px 6px;
  border-radius: 3px;
}

.group-leave-all {
  font-size: 10px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 2px 7px;
  border-radius: 3px;
  cursor: pointer;
  font-family: inherit;
}
.group-leave-all:hover {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}

.add-group-btn {
  background: transparent;
  border: 1px dashed var(--border);
  color: var(--text-dim);
  padding: 7px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
}
.add-group-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* Seat grid */
.seats-section {
  flex: 1;
  overflow-y: auto;
  padding: 14px 18px;
}
.seats-section .label-tiny { margin-bottom: 10px; display: block; }

.tables-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.table {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 6px 7px;
}

.table-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 4px;
  text-align: center;
}

.seats {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: 1fr 1fr;
  gap: 3px;
}

.seat {
  aspect-ratio: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.1s;
  position: relative;
}
.seat:hover {
  transform: scale(1.12);
  z-index: 2;
  box-shadow: 0 0 0 1px var(--accent);
}
.seat.occupied {
  border-color: rgba(255,255,255,0.25);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
}

.bottom-bar {
  padding: 14px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  background: var(--surface-2);
}

.btn-undo {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 9px 14px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
}
.btn-undo:hover { background: var(--surface); color: var(--text); }

.btn-submit {
  flex: 1;
  background: var(--accent);
  color: #1a1a1a;
  border: none;
  padding: 10px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.02em;
  font-family: 'Fraunces', serif;
}
.btn-submit:hover { background: var(--accent-bright); }
.btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px 26px;
  width: 560px;
  max-width: 92vw;
  max-height: 90vh;
  overflow-y: auto;
}

.modal h3 {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 20px;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}

.modal .summary {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 18px;
  font-family: 'JetBrains Mono', monospace;
}

.modal-section { margin-bottom: 18px; }

.modal-section label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  margin-bottom: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 600;
}

.modal input[type="text"], .modal input[type="password"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 12px;
  border-radius: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  margin-bottom: 6px;
}
.modal input:focus { outline: none; border-color: var(--accent); }

.modal-action-btn {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  font-family: inherit;
}

.btn-confirm {
  background: var(--accent);
  color: #1a1a1a;
}
.btn-confirm:hover { background: var(--accent-bright); }

.btn-confirm-alt {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border-strong);
}
.btn-confirm-alt:hover { background: var(--border); }

.btn-cancel {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 9px 16px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  width: 100%;
}
.btn-cancel:hover { background: var(--border); }

.section-divider {
  height: 1px;
  background: var(--border);
  margin: 16px 0 18px;
  position: relative;
}
.section-divider::after {
  content: 'OR';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: var(--surface);
  padding: 0 10px;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}

.events-log {
  max-height: 180px;
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 10px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  line-height: 1.7;
}
.events-log .ev { color: var(--text-dim); }
.events-log .ev .t { color: var(--accent); }
.events-log .ev .enter { color: var(--success); font-weight: 600; }
.events-log .ev .leave { color: var(--danger); font-weight: 600; }

.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error { border-color: var(--danger); color: var(--danger); }

.help-hint {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 4px;
  line-height: 1.5;
  font-family: 'JetBrains Mono', monospace;
}
.help-hint a { color: var(--accent); text-decoration: none; }
.help-hint a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <!-- LEFT -->
  <div class="left">
    <div class="header">
      <div class="brand">SEAT<span>·track</span></div>
      <input type="text" class="title-input" id="titleInput" placeholder="動画の題名を入力...">
      <label class="file-btn">
        動画を選択
        <input type="file" id="fileInput" accept="video/*">
      </label>
    </div>

    <div class="video-area">
      <div class="video-wrap">
        <video id="video" preload="metadata"></video>
        <div class="no-video" id="noVideo">動画ファイルを選択してください</div>
      </div>

      <div class="controls">
        <div class="seekbar-row">
          <button class="btn-play" id="playBtn" title="再生/一時停止 (Space)">▶</button>
          <input type="range" class="seekbar" id="seekbar" min="0" max="100" value="0" step="0.01">
          <div class="time-display"><span class="now" id="curTime">0:00.00</span> / <span id="totalTime">0:00.00</span></div>
        </div>
        <div class="button-row">
          <span class="label-tiny">SKIP</span>
          <button class="btn" data-skip="-10">-10s</button>
          <button class="btn" data-skip="-1">-1s</button>
          <button class="btn" data-skip="-0.1">-0.1s</button>
          <button class="btn" data-skip="0.1">+0.1s</button>
          <button class="btn" data-skip="1">+1s</button>
          <button class="btn" data-skip="10">+10s</button>
          <div class="divider"></div>
          <span class="label-tiny">SPEED</span>
          <button class="btn speed-btn" data-speed="0.25">0.25x</button>
          <button class="btn speed-btn" data-speed="0.5">0.5x</button>
          <button class="btn speed-btn active" data-speed="1">1x</button>
          <button class="btn speed-btn" data-speed="1.5">1.5x</button>
          <button class="btn speed-btn" data-speed="2">2x</button>
          <button class="btn speed-btn" data-speed="3">3x</button>
          <button class="btn speed-btn" data-speed="4">4x</button>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <div class="right-header">
      <h2>記録パネル</h2>
      <div class="desc">グループ選択 → 席クリックで <span style="color:var(--success)">入店</span> / もう一度で <span style="color:var(--danger)">退店</span> 記録</div>
    </div>

    <div class="groups-section">
      <span class="label-tiny">グループ (属性)</span>
      <div class="groups-list" id="groupsList"></div>
      <button class="add-group-btn" id="addGroupBtn">+ 新しいグループを作成</button>
    </div>

    <div class="seats-section">
      <span class="label-tiny">席配置 — 16テーブル × 12席 = 192席</span>
      <div class="tables-grid" id="tablesGrid"></div>
    </div>

    <div class="bottom-bar">
      <button class="btn-undo" id="undoBtn" title="直前の操作を取消 (Ctrl+Z)">↶ 取消</button>
      <button class="btn-submit" id="submitBtn">提出する</button>
    </div>
  </div>
</div>

<!-- Submit modal -->
<div class="modal-overlay" id="submitModal">
  <div class="modal">
    <h3>記録を提出</h3>
    <div class="summary" id="submitSummary"></div>

    <div class="modal-section">
      <label>記録内容のプレビュー (直近50件)</label>
      <div class="events-log" id="eventsLog"></div>
    </div>

    <div class="modal-section">
      <label>方法 1 — ローカルにJSONとしてダウンロード</label>
      <button class="modal-action-btn btn-confirm" id="downloadBtn">JSONをダウンロード</button>
    </div>

    <div class="section-divider"></div>

    <div class="modal-section">
      <label>方法 2 — GitHubのリポジトリへ直接コミット</label>
      <input type="text" id="ghOwner" placeholder="ユーザー名 (例: octocat)">
      <input type="text" id="ghRepo" placeholder="リポジトリ名 (例: my-records)">
      <input type="text" id="ghPath" placeholder="保存先パス (例: data/record-xxx.json)">
      <input type="password" id="ghToken" placeholder="Personal Access Token (repo権限)">
      <button class="modal-action-btn btn-confirm-alt" id="ghPushBtn" style="margin-top:4px;">GitHubにコミット</button>
      <div class="help-hint">
        ※ PAT は <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">github.com/settings/tokens</a> で発行 (repo権限 / Fine-grainedの場合 Contents: Read & Write)。トークンはブラウザ内のみで使用され送信先は api.github.com のみ。
      </div>
    </div>

    <button class="btn-cancel" id="closeModalBtn">閉じる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============== STATE ==============
const COLORS = [
  '#f0a020', '#4caf6a', '#3da9fc', '#e35d8a', '#9b6dd0',
  '#d97757', '#5fb3a1', '#c4b035', '#7a5cd9', '#dc6d6d',
  '#3da080', '#b562a8', '#ce8a3a', '#5dadce', '#7c9c4a',
  '#d04c8a', '#5d7cce', '#c9a035', '#6dc09a', '#a06dcd'
];

const state = {
  videoFile: null,
  groups: [],            // { id, label, color, createdAt }
  activeGroupId: null,
  events: [],            // { videoTime, action: 'enter'|'leave', seatId, groupId }
  seatStates: {},        // seatId -> { groupId, enterTime } | null
  history: []            // for undo: array of { events:[], seats:{seatId: previousState} }
};

// ============== DOM ==============
const $ = (id) => document.getElementById(id);
const video = $('video');
const noVideo = $('noVideo');
const seekbar = $('seekbar');
const curTime = $('curTime');
const totalTime = $('totalTime');
const playBtn = $('playBtn');
const titleInput = $('titleInput');
const fileInput = $('fileInput');
const groupsList = $('groupsList');
const tablesGrid = $('tablesGrid');
const submitBtn = $('submitBtn');
const undoBtn = $('undoBtn');
const submitModal = $('submitModal');
const toast = $('toast');

// ============== Helpers ==============
function fmtTime(t) {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  const cs = Math.floor((t % 1) * 100);
  if (m >= 60) {
    const h = Math.floor(m / 60);
    return `${h}:${String(m % 60).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  }
  return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}

function showToast(msg, type='info') {
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
}

// ============== Build seat grid ==============
function buildSeatGrid() {
  const html = [];
  let tableNum = 1;
  for (let cy = 0; cy < 8; cy++) {
    for (let cx = 0; cx < 2; cx++) {
      const tableId = `T${String(tableNum).padStart(2,'0')}`;
      let seats = '';
      for (let sy = 0; sy < 2; sy++) {
        for (let sx = 0; sx < 6; sx++) {
          const seatNum = sy * 6 + sx + 1;
          const seatId = `${tableId}-S${String(seatNum).padStart(2,'0')}`;
          seats += `<div class="seat" data-seat="${seatId}" title="${seatId}"></div>`;
        }
      }
      html.push(`<div class="table"><div class="table-num">${tableId}</div><div class="seats">${seats}</div></div>`);
      tableNum++;
    }
  }
  tablesGrid.innerHTML = html.join('');

  tablesGrid.addEventListener('click', (e) => {
    const seat = e.target.closest('.seat');
    if (seat) handleSeatClick(seat.dataset.seat);
  });
}

// ============== Groups ==============
function renderGroups() {
  if (state.groups.length === 0) {
    groupsList.innerHTML = '<div class="group-empty">グループ未登録 — 下のボタンで作成</div>';
    return;
  }
  groupsList.innerHTML = state.groups.map(g => {
    const occCount = Object.values(state.seatStates).filter(s => s && s.groupId === g.id).length;
    return `
      <div class="group-item ${g.id === state.activeGroupId ? 'active' : ''}" data-group="${g.id}">
        <div class="group-color" style="background:${g.color}"></div>
        <div class="group-label">${g.label}</div>
        <div class="group-count">${occCount}席</div>
        ${occCount > 0 ? `<button class="group-leave-all" data-leave="${g.id}" title="このグループ全員を退店記録">全員退店</button>` : ''}
      </div>
    `;
  }).join('');
}

function addGroup() {
  const id = 'g' + (state.groups.length + 1);
  const color = COLORS[state.groups.length % COLORS.length];
  const label = `グループ ${state.groups.length + 1}`;
  state.groups.push({ id, label, color, createdAt: Date.now() });
  state.activeGroupId = id;
  renderGroups();
}

groupsList.addEventListener('click', (e) => {
  const leaveBtn = e.target.closest('[data-leave]');
  if (leaveBtn) {
    e.stopPropagation();
    leaveAllInGroup(leaveBtn.dataset.leave);
    return;
  }
  const item = e.target.closest('[data-group]');
  if (item) {
    state.activeGroupId = item.dataset.group;
    renderGroups();
  }
});

function leaveAllInGroup(groupId) {
  const time = video.currentTime || 0;
  const seatsToLeave = Object.entries(state.seatStates)
    .filter(([_, s]) => s && s.groupId === groupId)
    .map(([sid]) => sid);
  if (seatsToLeave.length === 0) return;

  const undoStep = { events: [], seats: {} };
  for (const sid of seatsToLeave) {
    undoStep.seats[sid] = state.seatStates[sid] ? { ...state.seatStates[sid] } : null;
    const ev = { videoTime: time, action: 'leave', seatId: sid, groupId };
    state.events.push(ev);
    undoStep.events.push(ev);
    state.seatStates[sid] = null;
  }
  state.history.push(undoStep);
  refreshSeatVisuals();
  renderGroups();
  showToast(`${seatsToLeave.length}席を退店記録 (${fmtTime(time)})`, 'success');
}

$('addGroupBtn').addEventListener('click', addGroup);

// ============== Seat click ==============
function handleSeatClick(seatId) {
  if (!state.videoFile) {
    showToast('まず動画ファイルを選択してください', 'error');
    return;
  }
  const time = video.currentTime || 0;
  const cur = state.seatStates[seatId];

  if (cur) {
    // Leave
    const undoStep = { events: [], seats: { [seatId]: { ...cur } } };
    const ev = { videoTime: time, action: 'leave', seatId, groupId: cur.groupId };
    state.events.push(ev);
    undoStep.events.push(ev);
    state.history.push(undoStep);
    state.seatStates[seatId] = null;
  } else {
    // Enter (auto-create group if none)
    if (!state.activeGroupId) addGroup();
    const undoStep = { events: [], seats: { [seatId]: null } };
    const ev = { videoTime: time, action: 'enter', seatId, groupId: state.activeGroupId };
    state.events.push(ev);
    undoStep.events.push(ev);
    state.history.push(undoStep);
    state.seatStates[seatId] = { groupId: state.activeGroupId, enterTime: time };
  }
  refreshSeatVisuals();
  renderGroups();
}

function refreshSeatVisuals() {
  document.querySelectorAll('.seat').forEach(el => {
    const sid = el.dataset.seat;
    const s = state.seatStates[sid];
    if (s) {
      const g = state.groups.find(x => x.id === s.groupId);
      el.classList.add('occupied');
      el.style.background = g ? g.color : 'var(--accent)';
    } else {
      el.classList.remove('occupied');
      el.style.background = '';
    }
  });
}

// ============== Undo ==============
function doUndo() {
  const last = state.history.pop();
  if (!last) {
    showToast('取り消す操作がありません', 'error');
    return;
  }
  for (const ev of last.events) {
    const i = state.events.lastIndexOf(ev);
    if (i >= 0) state.events.splice(i, 1);
  }
  for (const [sid, prev] of Object.entries(last.seats)) {
    state.seatStates[sid] = prev;
  }
  refreshSeatVisuals();
  renderGroups();
  showToast(`${last.events.length}件取消しました`);
}
undoBtn.addEventListener('click', doUndo);

// ============== Video ==============
fileInput.addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  state.videoFile = f;
  if (!titleInput.value.trim()) titleInput.value = f.name;
  const url = URL.createObjectURL(f);
  video.src = url;
  noVideo.style.display = 'none';
  video.load();
});

video.addEventListener('loadedmetadata', () => {
  seekbar.max = video.duration;
  seekbar.step = 0.01;
  totalTime.textContent = fmtTime(video.duration);
});
video.addEventListener('timeupdate', () => {
  if (!seekbar.matches(':active')) seekbar.value = video.currentTime;
  curTime.textContent = fmtTime(video.currentTime);
});
video.addEventListener('play', () => playBtn.textContent = '❚❚');
video.addEventListener('pause', () => playBtn.textContent = '▶');

seekbar.addEventListener('input', () => {
  if (state.videoFile) video.currentTime = parseFloat(seekbar.value);
});

playBtn.addEventListener('click', () => {
  if (!state.videoFile) return;
  if (video.paused) video.play(); else video.pause();
});

document.querySelectorAll('[data-skip]').forEach(b => {
  b.addEventListener('click', () => {
    if (!state.videoFile) return;
    const dur = video.duration || 0;
    video.currentTime = Math.max(0, Math.min(dur, video.currentTime + parseFloat(b.dataset.skip)));
  });
});

document.querySelectorAll('[data-speed]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.speed-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    video.playbackRate = parseFloat(b.dataset.speed);
  });
});

// keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (!state.videoFile) return;
    if (video.paused) video.play(); else video.pause();
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault();
    video.currentTime = Math.max(0, video.currentTime - (e.shiftKey ? 5 : 1));
  } else if (e.code === 'ArrowRight') {
    e.preventDefault();
    video.currentTime = Math.min(video.duration || 0, video.currentTime + (e.shiftKey ? 5 : 1));
  } else if ((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') {
    e.preventDefault();
    doUndo();
  }
});

// ============== Submit ==============
function buildExport() {
  const open = {};
  const sessions = [];
  const sorted = [...state.events].sort((a,b) => a.videoTime - b.videoTime);
  for (const e of sorted) {
    if (e.action === 'enter') {
      open[e.seatId] = { groupId: e.groupId, enterTime: e.videoTime };
    } else {
      const o = open[e.seatId];
      sessions.push({
        seatId: e.seatId,
        groupId: o ? o.groupId : e.groupId,
        enterTime: o ? o.enterTime : null,
        leaveTime: e.videoTime
      });
      delete open[e.seatId];
    }
  }
  // ongoing sessions (not yet left)
  for (const [sid, o] of Object.entries(open)) {
    sessions.push({ seatId: sid, groupId: o.groupId, enterTime: o.enterTime, leaveTime: null });
  }
  return {
    videoTitle: titleInput.value.trim() || (state.videoFile ? state.videoFile.name : 'untitled'),
    videoFileName: state.videoFile ? state.videoFile.name : null,
    exportedAt: new Date().toISOString(),
    layout: { tables: 16, seatsPerTable: 12, totalSeats: 192 },
    groups: state.groups,
    events: sorted,
    sessions
  };
}

submitBtn.addEventListener('click', () => {
  const data = buildExport();
  $('submitSummary').textContent = `events: ${data.events.length}  /  groups: ${data.groups.length}  /  sessions: ${data.sessions.length}`;
  const log = data.events.slice(-50).reverse().map(e => {
    const g = state.groups.find(x => x.id === e.groupId);
    const lbl = e.action === 'enter' ? '入店' : '退店';
    return `<div class="ev"><span class="t">${fmtTime(e.videoTime)}</span> <span class="${e.action}">${lbl}</span> ${e.seatId} <span style="color:${g?.color || '#fff'}">●</span> ${g?.label || e.groupId}</div>`;
  }).join('');
  $('eventsLog').innerHTML = log || '<div style="color:var(--text-muted)">記録イベントはまだありません</div>';

  // pre-fill GitHub path
  if (!$('ghPath').value) {
    const safe = (data.videoTitle || 'record').replace(/[^a-zA-Z0-9_\-.]/g, '_').slice(0, 60);
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    $('ghPath').value = `data/${safe}_${stamp}.json`;
  }

  submitModal.classList.add('show');
});

$('closeModalBtn').addEventListener('click', () => submitModal.classList.remove('show'));
submitModal.addEventListener('click', (e) => {
  if (e.target === submitModal) submitModal.classList.remove('show');
});

$('downloadBtn').addEventListener('click', () => {
  const data = buildExport();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const safe = (data.videoTitle || 'record').replace(/[^a-zA-Z0-9_\-.]/g, '_').slice(0, 60);
  a.download = `seattrack_${safe}_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('ダウンロードしました', 'success');
});

$('ghPushBtn').addEventListener('click', async () => {
  const owner = $('ghOwner').value.trim();
  const repo = $('ghRepo').value.trim();
  const path = $('ghPath').value.trim();
  const token = $('ghToken').value.trim();
  if (!owner || !repo || !path || !token) {
    showToast('全フィールドを入力してください', 'error');
    return;
  }

  const data = buildExport();
  // base64 (UTF-8 safe)
  const json = JSON.stringify(data, null, 2);
  const content = btoa(String.fromCharCode(...new TextEncoder().encode(json)));

  const btn = $('ghPushBtn');
  const origText = btn.textContent;
  btn.textContent = '送信中...';
  btn.disabled = true;

  try {
    const apiUrl = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;

    // existing file?
    let sha = null;
    const checkRes = await fetch(apiUrl, {
      headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (checkRes.ok) {
      const meta = await checkRes.json();
      sha = meta.sha;
    } else if (checkRes.status !== 404) {
      const err = await checkRes.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${checkRes.status}`);
    }

    const body = {
      message: `seat-track: ${data.videoTitle} (${data.events.length} events)`,
      content,
      ...(sha ? { sha } : {})
    };

    const res = await fetch(apiUrl, {
      method: 'PUT',
      headers: {
        Authorization: `token ${token}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      const j = await res.json();
      showToast('GitHubにコミットしました', 'success');
      console.log('Commit:', j.commit?.html_url);
    } else {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${res.status}`);
    }
  } catch (err) {
    showToast(`エラー: ${err.message}`, 'error');
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
});

// ============== Init ==============
buildSeatGrid();
renderGroups();
</script>
